# Keeps data/ in step with the live registry at getfootgun.com. Runs daily; commits only when traps changed.
# Source: footgun-app mirror/.github/ (edit it there, not here).
name: Sync trap data

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: sync
        run: node .github/scripts/sync-data.mjs
      - name: Commit and push if data changed
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes to trap data."
            exit 0
          fi
          git -c user.name="Footgun" -c user.email="noreply@getfootgun.com" \
            commit -m "Update trap data: ${{ steps.sync.outputs.traps }} traps (${{ steps.sync.outputs.removed }} removed)"
          git push
